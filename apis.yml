aid: timeless
name: Timeless
description: 'Timeless (Timeless Investments GmbH) is a Berlin-based fintech that lets people invest in
  fractions of authenticated collectibles - luxury watches, classic cars, sneakers, fine wine, art, and
  memorabilia - starting at 50 EUR through its iOS and Android app. Assets are curated, authenticated,
  and securitized so users can buy, hold, and trade shares and exit when an asset sells. Backed by EQT
  Ventures. Timeless is a consumer mobile-app platform and publishes no public developer portal or API;
  its api.timeless.investments backend is private and authenticated.'
